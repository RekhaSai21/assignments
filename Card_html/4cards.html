<head>
<meta charset="UTF-8">

<title>Browse Our Guides</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: white;
}

/* Section */
.guides-section {
    padding: 50px 20px 70px;
    text-align: center;
}

/* Heading */
.guides-section h2 {
    font-size: 48px;
    font-family: Georgia, serif;
    font-weight: 700;
    color: black;
    margin-bottom: 15px;
}

.guides-section h2 span {
    position: relative;
}

.guides-section h2 span::after {
    content: "";
    width: 45px;
    height: 2px;
    background: pink;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    bottom: -8px;
}

/* Cards Container */
.guides-container {
    max-width: 1100px;
    margin: 50px auto 0;
    display: flex;
    justify-content: center;
    gap: 18px;
    flex-wrap: wrap;
}

/* Card */
.guide-card {
    position: relative;
    width: 255px;
    height: 380px;
    overflow: hidden;
    cursor: pointer;
}

/* Background Image */
.guide-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}

/* Dark Overlay */
.guide-card::before {
    position:relative;
    /* inset: 0; */
    background: rgb(114, 111, 111);
    z-index: 1;
}

/* White Border */
.guide-card::after {
    content: "";
    position: absolute;
    top: 14px;
    left: 14px;
    right: 14px;
    bottom: 14px;
    border: 2px solid white;
    z-index: 2;
}

/* Content */
.card-content {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-transform: uppercase;
}

/* Main Title */
.card-content h3 {
    font-family: Georgia, serif;
    font-size: 28px;
    font-style: italic;
    font-weight: bold;
    text-transform: none;
    margin-bottom: 5px;
}

/* Subtitle */
.card-content h4 {
    font-size: 18px;
    font-weight: 400;
    letter-spacing: 1px;
    margin-bottom: 55px;
}

/* Explore Link */
.card-content a {
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: 500;
    position: relative;
}

.card-content a::after {
    content: "";
    display: block;
    width: 50px;
    height: 2px;
    background: pink;
    margin: 6px auto 0;
}

/* Hover Effect */
/* .guide-card:hover img {

}

.guide-card img {
    transition: 0.4s ease;
} */
